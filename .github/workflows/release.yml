name: Package Splay webOS
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tests/api.test.js
      - run: node --check app/api.js && node --check app/app.js
      - run: |
          npm install --global @webos-tools/cli
          mkdir -p dist
          ares-package -o dist app
          python3 scripts/prepare_release.py --ipk dist/*.ipk --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: splay-webos-build
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release create "${{ github.ref_name }}" dist/*.ipk dist/*.manifest.json --title "Splay webOS ${{ github.ref_name }}" --notes "Experimental webOS preview; test on a physical TV before distribution."
